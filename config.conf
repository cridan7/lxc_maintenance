# Centralized Configuration Settings

# Timeouts
request_timeout = 30  # seconds
retry_timeout = 5  # seconds

# Paths
log_path = "/var/log/lxc_maintenance/"
data_path = "/var/lib/lxc_maintenance/"

# Docker Intervals
cleanup_interval = "0 3 * * *"  # Daily at 3 AM
backup_interval = "0 2 * * 1"  # Weekly on Mondays at 2 AM

# Logging
log_level = "info"
log_format = "json"

# Feature Flags
enable_new_feature = true
enable_logging = true
