# Configuration File Template

# Default settings for lxc_maintenance

# Maintenance interval in hours
maintenance_interval: 24

# Notification settings
notification:
  enabled: true
  email: user@example.com

# Logging level
logging:
  level: info

# Backup settings
backup:
  enabled: true
  backup_location: /backups
  backup_frequency: daily

# Resource limits
resource_limits:
  cpu: 2
  memory: 2048MB

# Timeout settings
timeout:
  maintenance_timeout: 3600
